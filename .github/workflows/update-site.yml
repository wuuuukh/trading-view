name: Update trading website

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. These retry windows cover Taiwan market
    # data arriving later than the first scheduled update.
    - cron: "30 8 * * *"  # 16:30 Asia/Taipei
    - cron: "10 9 * * *"  # 17:10 Asia/Taipei
    - cron: "0 10 * * *"  # 18:00 Asia/Taipei

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update reports and static site
        run: .\scripts\update_all.ps1
        shell: powershell

      - name: Commit updated website
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports site docs config scripts index.html record
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit."
            exit 0
          }
          git commit -m "Update trading website"
          git push

      - name: Publish public website only
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "trading-view-pages"
          if (Test-Path -LiteralPath $publishDir) {
            Remove-Item -LiteralPath $publishDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null
          Copy-Item -LiteralPath "docs\index.html" -Destination (Join-Path $publishDir "index.html") -Force
          Set-Content -LiteralPath (Join-Path $publishDir ".nojekyll") -Value "" -Encoding ascii

          Push-Location $publishDir
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          git commit -m "Publish public dashboard"
          git remote add origin "https://x-access-token:$env:GITHUB_TOKEN@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages
          Pop-Location
